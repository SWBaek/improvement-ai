name: Capability Blueprint proposal
description: AI가 프로젝트별 Skill과 workflow를 생성하도록 안내할 새 Blueprint를 제안합니다.
title: "[Blueprint] "
labels: ["type: blueprint", "area: blueprints", "status: triage"]
body:
  - type: input
    id: capability_name
    attributes:
      label: Capability 이름
      description: 소문자 kebab-case Blueprint 이름 후보를 작성해 주세요.
      placeholder: manage-example-workflow
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 반복되는 문제
      description: 여러 프로젝트에서 사람이 AI와 일할 때 반복되는 비용이나 실패를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: contexts
    attributes:
      label: Target과 non-target context
      description: 언제 이 capability를 생성해야 하고 언제 생성하지 않아야 하는지 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Required outcomes와 invariants
      description: 프로젝트별 구현이 달라도 반드시 성립해야 하는 결과와 안전 조건을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: adaptation
    attributes:
      label: 프로젝트 적응 지점
      description: AI가 대상 프로젝트에서 조사하고 선택해야 할 기록, Agent, Skill 분해와 표현 방식을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: 인간 승인과 권한 경계
      description: 파일 생성, 외부 쓰기와 중요한 상태 변경 전에 필요한 승인을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: pilots
    attributes:
      label: Pilot과 완료 조건
      description: 서로 다른 두 프로젝트에서 생성·실사용을 확인할 방법을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 프로젝트 A에서 구성 제안과 생성 결과를 검증한다.
        - [ ] 프로젝트 B에서 동일 invariants가 다른 관례에 적응하는지 검증한다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고자료와 출처
      description: 유사한 Idea File, workflow, 연구와 복사할 자산의 license를 기록해 주세요.
    validations:
      required: false
  - type: checkboxes
    id: boundaries
    attributes:
      label: 생성과 설치 경계
      options:
        - label: 생성 결과는 대상 프로젝트 내부에만 두며 전역 Agent Skill 설치나 새 cross-project 공유 상태를 제안하지 않습니다.
          required: true
        - label: 설치안은 path-scoped Blueprint revision과 단일 Installation Receipt를 포함합니다.
          required: true
        - label: 설치형 Skill, runtime, package, formal schema 또는 generator를 이 저장소에 추가하는 제안이 아닙니다.
          required: true
