name: CLI or tool proposal
description: 새 CLI, npm package, script 또는 자동화 도구를 제안합니다.
title: "[Tool] "
labels: ["type: tool", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 반복되는 문제
      description: 기존 도구로 해결되지 않는 반복 작업과 발생 빈도를 작성해 주세요.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 도구 유형
      options:
        - CLI
        - npm package
        - Script or automation
        - Configuration generator
        - Installer or synchronizer
        - Other
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: 예상 인터페이스
      description: 명령, 인자, 입력과 출력 예시를 작성해 주세요.
      render: shell
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 조사한 기존 도구
      description: 대체 가능한 CLI나 package와 충분하지 않은 이유를 작성해 주세요.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: 지원 환경
      multiple: true
      options:
        - Windows PowerShell
        - macOS
        - Linux
        - Node.js
        - Python
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 상태 변경과 안전장치
      description: 파일 변경, 네트워크 접근, 인증, dry-run과 rollback 요구를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] 핵심 명령의 성공·실패 경로가 테스트된다.
        - [ ] 지원 환경과 설치법이 문서화된다.
        - [ ] 상태 변경 전 확인 또는 dry-run을 제공한다.
    validations:
      required: true
