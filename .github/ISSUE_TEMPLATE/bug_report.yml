name: Bug report
description: 재현 가능한 결함이나 기존 동작의 회귀를 보고합니다.
title: "[Bug] "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        보고 전에 민감한 값, 토큰과 개인 경로가 포함되지 않았는지 확인해 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었고 누구에게 어떤 영향을 주는지 설명해 주세요.
      placeholder: 한두 문장으로 문제와 영향을 설명합니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 최소한의 명령과 입력을 순서대로 작성해 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떤 결과가 나와야 하는지 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작과 증거
      description: 오류 메시지, 로그 또는 화면을 민감한 정보 없이 첨부해 주세요.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - blueprints
        - github-governance
        - documentation
        - unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: OS, AI agent, CLI와 관련 package 버전을 작성해 주세요.
      placeholder: Windows 11, Codex, Blueprint commit, gh 2.x
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 수정되었다고 판단할 수 있는 검증 가능한 조건을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 최소 재현 사례가 통과한다.
        - [ ] 회귀 테스트가 추가된다.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에서 같은 문제를 검색했습니다.
          required: true
        - label: 토큰, 비밀번호와 기타 민감한 정보를 제거했습니다.
          required: true
