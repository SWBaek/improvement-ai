name: Skill proposal
description: 새 전역 Agent Skill 또는 기존 skill의 큰 변경을 제안합니다.
title: "[Skill] "
labels: ["type: skill", "area: skills", "status: triage"]
body:
  - type: input
    id: skill_name
    attributes:
      label: Skill 이름
      description: 소문자 kebab-case 후보를 작성해 주세요.
      placeholder: example-skill
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 사용 조건과 trigger
      description: 어떤 사용자 요청이나 상황에서 이 skill이 자동으로 선택되어야 하는지 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
      description: skill이 반복 가능하게 만들어야 하는 결과를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 예상 workflow
      description: 주요 단계, 입력, 출력과 필요한 도구를 작성해 주세요.
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: 대상 agent
      multiple: true
      options:
        - Tool-agnostic
        - Codex
        - Claude Code
        - Cursor
        - GitHub Copilot
        - Other
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 기존 skill과 참고자료
      description: 유사 skill, 공식 문서, 원본 저장소와 라이선스를 기록해 주세요.
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: 권한과 안전성
      description: 외부 쓰기, 인증, 삭제 또는 파괴적 작업이 있다면 명시해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] trigger와 비-trigger 사례가 검증된다.
        - [ ] 지원 agent에서 결과가 확인된다.
        - [ ] 설치와 사용법이 문서화된다.
    validations:
      required: true
