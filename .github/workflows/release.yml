name: Release changed Skills

on:
  push:
    branches: [main]
    paths: [skills/catalog.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Release changed versions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh auth status
          previous_catalog="$(mktemp)"
          if ! git show "$BEFORE_SHA:skills/catalog.json" > "$previous_catalog"; then
            printf '{"skills":[]}' > "$previous_catalog"
          fi

          declare -A previous_versions
          while IFS=$'\t' read -r name version; do
            previous_versions["$name"]="$version"
          done < <(jq -r '.skills[] | [.name, .version] | @tsv' "$previous_catalog")

          while IFS=$'\t' read -r name version; do
            [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "Invalid Skill name: $name" >&2; exit 1; }
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
            [[ "${previous_versions[$name]-}" == "$version" ]] && continue

            tag="$name-v$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists: $tag"
              continue
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$AFTER_SHA" \
              --title "$name v$version" \
              --generate-notes
          done < <(jq -r '.skills[] | [.name, .version] | @tsv' skills/catalog.json)
