<header><p class="notice">규격이 아닌 연구용 저충실도 Prototype</p><h1>주간 백업 방식 비교</h1><p>동일 기준으로 순위를 정한 뒤 하나를 결정하거나 보류하세요.</p></header>
<main>
  <table><caption>대안별 비교</caption><thead><tr><th>대안</th><th>복구</th><th>자동화</th><th>비용</th><th>독립성</th><th>추정</th></tr></thead><tbody><tr><th>외장 SSD</th><td>빠름</td><td>수동 연결</td><td>월 비용 없음</td><td>높음</td><td>3.55</td></tr><tr><th>클라우드</th><td>네트워크 필요</td><td>높음</td><td>월 비용</td><td>낮음</td><td>3.90</td></tr><tr><th>혼합</th><td>경로 2개</td><td>부분 자동</td><td>가장 큼</td><td>중간</td><td>4.20</td></tr></tbody></table>
